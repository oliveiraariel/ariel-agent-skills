name: Validate skills

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'analysis/**'
    paths:
      - '**/SKILL.md'
      - '**/scripts/*.py'
      - '**/references/**'
      - '**/README.md'
      - '**/CHANGELOG.md'
      - 'registry/**'
      - 'docs/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate ecosystem registry and skill contracts
        run: python3 scripts/validate_ecosystem.py

      - name: Validate discovered skill validators
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t validators < <(find . -type f -path '*/scripts/validate_skill.py' | sort)
          for validator in "${validators[@]}"; do
            echo "Running $validator"
            python3 "$validator"
          done
